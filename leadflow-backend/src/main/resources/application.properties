
# Application Name
spring.application.name=leadflow-backend

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/leadflow_crm
spring.datasource.username=leadflow_user
spring.datasource.password=YourOwnUniqueStrongPassword
# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server Configuration
server.port=8080
